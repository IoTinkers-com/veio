name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skill frontmatter check (name == directory)
        run: |
          fail=0
          for f in .claude/skills/*/SKILL.md; do
            dir=$(basename "$(dirname "$f")")
            name=$(sed -n 's/^name:[[:space:]]*//p' "$f" | head -n1)
            if [ "$name" != "$dir" ]; then echo "ERROR: $f name '$name' != dir '$dir'"; fail=1; fi
          done
          exit $fail
      - name: Markdown link check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-path: '.github/mlc-config.json'
        continue-on-error: true
