name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (latest binary)
        run: |
          VER=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
          curl -sSL -o gl.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/${VER}/gitleaks_${VER#v}_linux_x64.tar.gz"
          tar -xzf gl.tar.gz gitleaks
      - name: Secret scan
        run: ./gitleaks detect --source . --redact --exit-code 1 --no-banner

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skill frontmatter check (name == directory)
        run: |
          fail=0
          for f in .claude/skills/*/SKILL.md; do
            dir=$(basename "$(dirname "$f")")
            name=$(sed -n 's/^name:[[:space:]]*//p' "$f" | head -n1)
            if [ "$name" != "$dir" ]; then echo "ERROR: $f name '$name' != dir '$dir'"; fail=1; fi
          done
          exit $fail
      - name: Docs drift check
        run: python3 scripts/check_docs.py
      - name: Markdown link check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-path: '.github/mlc-config.json'
        continue-on-error: true
