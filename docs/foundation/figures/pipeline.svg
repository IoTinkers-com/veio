<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">VEIO — how the platform works</text>
  <text x="500" y="52" text-anchor="middle" font-size="13" fill="#666">Four layers — never merged</text>

  <rect x="20" y="80" width="200" height="170" rx="12" fill="#eef5fb" stroke="#2c6fbb" stroke-width="2"/>
  <text x="120" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c6fbb">1 · DATA</text>
  <text x="120" y="131" text-anchor="middle" font-size="11.5" fill="#333">public, licensed datasets</text>
  <text x="120" y="154" text-anchor="middle" font-size="10.5" fill="#444">Sentinel-1 / Sentinel-2</text>
  <text x="120" y="171" text-anchor="middle" font-size="10.5" fill="#444">Landsat · FIRMS</text>
  <text x="120" y="188" text-anchor="middle" font-size="10.5" fill="#444">Black Marble · OGIM</text>
  <text x="120" y="205" text-anchor="middle" font-size="10.5" fill="#444">TROPOMI · EMIT</text>
  <text x="120" y="231" text-anchor="middle" font-size="10" fill="#777">dataset card: license,</text>
  <text x="120" y="244" text-anchor="middle" font-size="10" fill="#777">provenance, coverage</text>

  <rect x="260" y="80" width="200" height="170" rx="12" fill="#eef7ee" stroke="#2e8b57" stroke-width="2"/>
  <text x="360" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e8b57">2 · PROCESSING</text>
  <text x="360" y="131" text-anchor="middle" font-size="11.5" fill="#333">our scripts → derived data</text>
  <text x="360" y="154" text-anchor="middle" font-size="10.5" fill="#444">composites · indices</text>
  <text x="360" y="171" text-anchor="middle" font-size="10.5" fill="#444">hotspot clusters · objects</text>
  <text x="360" y="194" text-anchor="middle" font-size="10.5" fill="#444">pre-registered, re-runnable</text>
  <text x="360" y="231" text-anchor="middle" font-size="10" fill="#777">manifest + checksums</text>
  <text x="360" y="244" text-anchor="middle" font-size="10" fill="#777">(reproducible)</text>

  <rect x="500" y="80" width="200" height="170" rx="12" fill="#fdf6e8" stroke="#c8871a" stroke-width="2"/>
  <text x="600" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#c8871a">3 · OBSERVATION</text>
  <text x="600" y="131" text-anchor="middle" font-size="11.5" fill="#333">what the data shows</text>
  <text x="600" y="154" text-anchor="middle" font-size="10.5" fill="#444">“persistent thermal activity</text>
  <text x="600" y="171" text-anchor="middle" font-size="10.5" fill="#444">compatible with flaring”</text>
  <text x="600" y="194" text-anchor="middle" font-size="10.5" fill="#444">dated · located · sourced</text>
  <text x="600" y="231" text-anchor="middle" font-size="10" fill="#777">confidence: low /</text>
  <text x="600" y="244" text-anchor="middle" font-size="10" fill="#777">moderate / strong</text>

  <rect x="740" y="80" width="200" height="170" rx="12" fill="#f7eef7" stroke="#8e44ad" stroke-width="2"/>
  <text x="840" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e44ad">4 · INTERPRETATION</text>
  <text x="840" y="131" text-anchor="middle" font-size="11.5" fill="#333">what it might mean</text>
  <text x="840" y="154" text-anchor="middle" font-size="10.5" fill="#444">hypotheses, context</text>
  <text x="840" y="171" text-anchor="middle" font-size="10.5" fill="#444">clearly labelled</text>
  <text x="840" y="194" text-anchor="middle" font-size="10.5" fill="#444">separate from facts</text>
  <text x="840" y="231" text-anchor="middle" font-size="10" fill="#777">never merged with</text>
  <text x="840" y="244" text-anchor="middle" font-size="10" fill="#777">observations</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <line x1="222" y1="165" x2="256" y2="165" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="462" y1="165" x2="496" y2="165" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="702" y1="165" x2="736" y2="165" stroke="#555" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="719" y="205" text-anchor="middle" font-size="9" fill="#999" transform="rotate(-90 719 205)">never merged</text>

  <rect x="20" y="300" width="920" height="46" rx="10" fill="#f2f2f2" stroke="#ccc"/>
  <text x="480" y="320" text-anchor="middle" font-size="12" fill="#333">Evidence chain: every observation cites its source dataset (DS-####), its processing script + manifest, and its limitations.</text>
  <text x="480" y="338" text-anchor="middle" font-size="12" fill="#333">Method status is explicit: validated · scope-limited · pre-registered · not validated · exploratory.</text>

  <text x="500" y="384" text-anchor="middle" font-size="11.5" fill="#555">Product: a public Atlas + Asset Dossiers (17 assets) · Steward: IoTinkers · designed as a community observatory</text>
  <text x="500" y="404" text-anchor="middle" font-size="10.5" fill="#999">Bottom line: observation ≠ interpretation ≠ conclusion. Brevity never drops a citation, license or limitation.</text>
</svg>
